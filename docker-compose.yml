# Self-hosted n8n + the Play Store reviews service.
# Start:  docker compose up -d --build     Open: http://localhost:5678
services:
  n8n:
    # Pin a specific version once it works for you, e.g. N8N_VERSION=1.x.y in .env
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - TZ=${GENERIC_TIMEZONE:-Asia/Kolkata}
      # Workflows may only read/write files inside /data (mapped to ./data in this repo)
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      # Allows logging in over plain http://localhost. Remove once you serve n8n over HTTPS.
      - N8N_SECURE_COOKIE=false
      # Set to your public HTTPS address later, so form/webhook links (the testable link) are correct
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
    depends_on:
      - playstore-reviews

  playstore-reviews:
    build: ./services/playstore-reviews
    restart: unless-stopped
    # Not published to the internet; n8n reaches it at http://playstore-reviews:3000
    expose:
      - "3000"

volumes:
  n8n_data:
